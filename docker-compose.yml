services:
  influxdbv3:
    image: influxdb:3-core
    container_name: influxdbv3
    ports:
      - "8181:8181"
    volumes:
      - influxdbv3-data:/var/lib/influxdb3
    environment:
      - INFLUXDB3_TELEMETRY_DISABLE_UPLOAD=true
      - INFLUXDB3_ADMIN_TOKEN_FILE=/run/secrets/admin_token
      - INFLUXDB3_PLUGIN_DIR=/var/lib/influxdb3/plugins
      - INFLUXDB3_DB_DIR=/var/lib/influxdb3/data
      - INFLUXDB3_NODE_IDENTIFIER_PREFIX=node0
      - INFLUXDB3_OBJECT_STORE=file
    secrets:
      - admin_token
    restart: unless-stopped
    networks:
      - tig

  telegraf:
    ports:
      - "7081:7081"
    image: telegraf:1.37
    container_name: telegraf
    depends_on:
      - influxdbv3
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
    restart: unless-stopped
    networks:
      - tig

  grafana:
    image: grafana/grafana:12.3
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - influxdbv3
    restart: unless-stopped
    networks:
      - tig

volumes:
  influxdbv3-data:
  grafana-data:

networks:
  tig:
    driver: bridge


secrets:
  admin_token:
    file: ./admin-token.json
